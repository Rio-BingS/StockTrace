# Nginx site for StockTrace
# Install: /etc/nginx/sites-available/stocktrace → sites-enabled
# Requires: htpasswd file at /etc/nginx/.htpasswd_stocktrace
#           Cloudflare Origin 证书（Cloudflare 后台签发，见 DEPLOY.md 第 5 节）
#           /etc/ssl/stocktrace/origin.pem + origin.key

# --- Cloudflare 回源真实 IP（限流按真实客户端计） ---
# 不还原真实 IP 的话，$binary_remote_addr 全是 CF 节点，限流会误伤所有用户。
# 列表来源 https://www.cloudflare.com/ips/，上游更新时需同步。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- 单 IP 限流：正常使用（看板轮询 60s 一次）远低于此阈值，
# 主要防脚本滥刷/失控循环打爆 1H2G；超限返回 429 ---
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
# /admin/ 单独更严的 zone（SEC-02）：admin 登录表单是另一个可爆破入口，正常人每分钟几次足够
limit_req_zone $binary_remote_addr zone=admin:1m rate=30r/m;
limit_req_status 429;

# --- Content-Security-Policy（P3 第 14 条）---
# 策略按 npm run build 产物实测收紧（见 DEPLOY.md 5.6）：
# - script-src 'self'：dist/index.html 只有外链 /assets/*.js，无内联脚本；产物无 eval/new Function；
#   Django admin（6.x）脚本全部外链，json/data 常量用 data-* 属性，不需要 nonce
# - style-src 需要 'unsafe-inline'：ECharts tooltip（默认与自定义 formatter）以 innerHTML 写入带
#   style="" 的 HTML；Vue :style 走 CSSOM 不受限，但上面这条绕不开
# - img/font/connect 都只有同源：站内无外部字体/图片，API 走同源 /api/，LLM 由后端代发，无 websocket
# - frame-ancestors 'none' 与 X-Frame-Options DENY 等价，两者并存（老浏览器只认 XFO），不算重复
# 上线方式：先 Report-Only 观察（只在浏览器控制台报违规，不拦截）。观察期无违规后改为强制：
# 把下面第一个 map 的策略串剪切到第二个 map、第一个改回 ""（空值时 nginx 不下发该头）。
# 两个 map 不要同时非空：Report-Only 与强制同时下发虽合法，但会让观察结论混淆。
map $host $stocktrace_csp_report_only {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
}
map $host $stocktrace_csp {
    default "";
}

# HTTP 仅用于跳转 HTTPS（Cloudflare Full (strict) 模式下回源走 443）
server {
    listen 80;
    server_name stocktrace.yumeat.cc.cd;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stocktrace.yumeat.cc.cd;

    # Cloudflare Origin Certificate：仅用于 CF↔源站加密，
    # 浏览器不直接访问源站；443 只放行 CF 网段见 deploy/ufw-cloudflare.sh（SEC-10）。
    # 注意：real_ip 已把 $remote_addr 换成真实客户端，nginx 的 allow/deny 挡不住直连源站，必须在防火墙层做
    ssl_certificate     /etc/ssl/stocktrace/origin.pem;
    ssl_certificate_key /etc/ssl/stocktrace/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # ---- 安全响应头（SEC-10）----
    # 不暴露 nginx 版本；禁止 MIME 嗅探与被 iframe 嵌入；跨站不带完整 Referer。
    # nginx 继承规则：location 里写了任何 add_header，就不再继承这里的，下面 /assets/ 与
    # index.html 两处因此重复声明（含两条 CSP）。反代到 Django 的 location 用 proxy_hide_header
    # 去掉 Django 自己下发的同名头（含 CSP，Django 6 自带 CSP 中间件），避免响应里出现两份。
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP 值来自文件顶部的 map；值为空的那个头 nginx 不会下发（P3 第 14 条）
    add_header Content-Security-Policy $stocktrace_csp always;
    add_header Content-Security-Policy-Report-Only $stocktrace_csp_report_only always;

    # 限流放在 server 级（SEC-02）：之前只挂在 /api/、/admin/，而 / 与 /static/ 同样要求
    # Basic Auth 却不限速，可被用来高速试密码。limit_req 在 preaccess 阶段执行，
    # 早于 auth_basic，所以 401 的猜密码请求同样计数。
    # 注意 nginx 继承规则：location 里一旦写了 limit_req，就不再继承这里的配置。
    limit_req zone=perip burst=20 nodelay;

    # fail2ban 封禁名单（SEC-02，见 deploy/fail2ban-stocktrace.local）：站点在 Cloudflare 后面，
    # iptables 封真实 IP 无效（连接来自 CF 节点），改由 nginx 按 real_ip 拒绝。
    # 通配 include：目录为空或不存在时 nginx -t 也能通过。
    include /etc/nginx/stocktrace-deny.d/*.conf;

    auth_basic "StockTrace";
    auth_basic_user_file /etc/nginx/.htpasswd_stocktrace;

    root /opt/stocktrace/frontend/dist;
    index index.html;

    # SPA history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页不缓存：发版后旧 index.html 引用已删除的哈希资源会白屏（SEC-10）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $stocktrace_csp always;
        add_header Content-Security-Policy-Report-Only $stocktrace_csp_report_only always;
    }

    # Vite 构建产物文件名带内容哈希，可长期缓存
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $stocktrace_csp always;
        add_header Content-Security-Policy-Report-Only $stocktrace_csp_report_only always;
    }

    # 健康检查只给本机（cron / uptime-kuma）用；外部探测请走 SSH。本机也可直接 curl 127.0.0.1:8000
    location = /api/health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 与 server 级相同；保留显式声明，日后给 /api/ 单独加 zone 时不会意外丢掉 perip
        limit_req zone=perip burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /admin/ {
        limit_req zone=perip burst=20 nodelay;
        limit_req zone=admin burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/stocktrace/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Optional: deny access to accidental backup tarballs under dist
    location ~* \.(tar|gz|zip)$ {
        deny all;
    }
}
