# Nginx site for StockTrace
# Install: /etc/nginx/sites-available/stocktrace → sites-enabled
# Requires: htpasswd file at /etc/nginx/.htpasswd_stocktrace
#           Cloudflare Origin 证书（Cloudflare 后台签发，见 DEPLOY.md 第 5 节）
#           /etc/ssl/stocktrace/origin.pem + origin.key

# --- Cloudflare 回源真实 IP（限流按真实客户端计） ---
# 不还原真实 IP 的话，$binary_remote_addr 全是 CF 节点，限流会误伤所有用户。
# 列表来源 https://www.cloudflare.com/ips/，上游更新时需同步。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- 单 IP 限流：正常使用（看板轮询 60s 一次）远低于此阈值，
# 主要防脚本滥刷/失控循环打爆 1H2G；超限返回 429 ---
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
# /admin/ 单独更严的 zone（SEC-02）：admin 登录表单是另一个可爆破入口，正常人每分钟几次足够
limit_req_zone $binary_remote_addr zone=admin:1m rate=30r/m;
limit_req_status 429;

# HTTP 仅用于跳转 HTTPS（Cloudflare Full (strict) 模式下回源走 443）
server {
    listen 80;
    server_name stocktrace.yumeat.cc.cd;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stocktrace.yumeat.cc.cd;

    # Cloudflare Origin Certificate：仅用于 CF↔源站加密，
    # 浏览器不直接访问源站（防火墙可另限制 443 只放行 CF 网段）
    ssl_certificate     /etc/ssl/stocktrace/origin.pem;
    ssl_certificate_key /etc/ssl/stocktrace/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # 限流放在 server 级（SEC-02）：之前只挂在 /api/、/admin/，而 / 与 /static/ 同样要求
    # Basic Auth 却不限速，可被用来高速试密码。limit_req 在 preaccess 阶段执行，
    # 早于 auth_basic，所以 401 的猜密码请求同样计数。
    # 注意 nginx 继承规则：location 里一旦写了 limit_req，就不再继承这里的配置。
    limit_req zone=perip burst=20 nodelay;

    # fail2ban 封禁名单（SEC-02，见 deploy/fail2ban-stocktrace.local）：站点在 Cloudflare 后面，
    # iptables 封真实 IP 无效（连接来自 CF 节点），改由 nginx 按 real_ip 拒绝。
    # 通配 include：目录为空或不存在时 nginx -t 也能通过。
    include /etc/nginx/stocktrace-deny.d/*.conf;

    auth_basic "StockTrace";
    auth_basic_user_file /etc/nginx/.htpasswd_stocktrace;

    root /opt/stocktrace/frontend/dist;
    index index.html;

    # SPA history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查只给本机（cron / uptime-kuma）用；外部探测请走 SSH。本机也可直接 curl 127.0.0.1:8000
    location = /api/health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 与 server 级相同；保留显式声明，日后给 /api/ 单独加 zone 时不会意外丢掉 perip
        limit_req zone=perip burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /admin/ {
        limit_req zone=perip burst=20 nodelay;
        limit_req zone=admin burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/stocktrace/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Optional: deny access to accidental backup tarballs under dist
    location ~* \.(tar|gz|zip)$ {
        deny all;
    }
}
