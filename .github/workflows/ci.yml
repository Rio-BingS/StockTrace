# StockTrace CI（OPS-04）：后端 lint/检查/迁移一致性/断网测试 + 前端 lint/测试/构建。
# 测试一律在 CI 跑，生产机不再停服跑测试（见 OPS-05）。
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: 'True'
      TZ: Asia/Shanghai
      # 测试进程不起调度器、不放开断网闸（IsolatedTestRunner 默认即断网）
      STOCKTRACE_SCHEDULER: '0'
      STOCKTRACE_RUN_SCHEDULER_IN_WEB: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        # 与生产一致装锁文件的精确版本；dev 文件只额外带入 ruff
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (network blocked)
        run: python manage.py test --noinput

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # vite 8 / rolldown 要求 ^20.19 || >=22.12，eslint 10 要求 ^22.13：取 22 LTS 最新补丁
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
